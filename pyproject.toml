[project]
name = "blender-mcp"
version = "1.9.1.post1"
description = "Better Blender MCP: compact tools, isolated workers and reference-driven model checks"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "Siddharth Ahuja", email = "ahujasid@gmail.com"}
]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=1.9.0,<2",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pillow>=11,<13", "numpy>=2,<3"]

[project.scripts]
blender-mcp = "blender_mcp.server:main"
better-blender-mcp = "blender_mcp.compact_server:main"

[tool.pytest.ini_options]
python_files = ["test_*.py"]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
blender_mcp = ["bundled/addon.py"]

[project.urls]
"Homepage" = "https://github.com/marlonka/better-blender-mcp"
"Bug Tracker" = "https://github.com/marlonka/better-blender-mcp/issues"
